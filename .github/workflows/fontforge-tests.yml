name: FontForge Worker Tests

on:
  push:
  pull_request:

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run FontForge worker tests
        run: cargo test --test fontforge_worker

      - name: Run library tests
        run: cargo test --lib

      - name: Compile all Rust tests
        run: cargo test --no-run
