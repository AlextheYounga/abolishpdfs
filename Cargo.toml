[package]
name = "abolishpdfs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.33"
pdfium-render = { version = "0.9.3", features = ["thread_safe", "image_latest"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
