[versions]
pdfium = "7881"
fontforge = "20230101"
playwright = "1.52.0"
extension = "abext1"

[pdfium]
# The converter mandates the patched runtime produced by the PDFium fork. The
# artifact and checksum must match a published PDFium release asset.
artifact = "pdfium-linux-x64-chromium7881-abext1.tgz"
sha256 = "04578049f55318b4d8d15f3d3f07b68084ae33e3fb49fd3caba387197925b62e"
library = "lib/libpdfium.so"

[runtime]
directory = ".runtime"
pdfium_directory = "pdfium-7881"
python_directory = "python"
browser_directory = "browsers"
integration_directory = "integration-output"
screenshot_directory = "corpus-screenshots"
